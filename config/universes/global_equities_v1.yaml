version: 1
as_of: "2024"
constituent_source: >-
  Legacy tickers_2024 research list committed with project. Original selection
  methodology and point-in-time constituent source were not preserved.
survivorship_bias: >-
  Snapshot is not point-in-time constituent history. Results may contain
  survivorship and selection bias; do not interpret them as investable history.
reference_currency: EUR
fx_policy: convert_to_reference

# Yahoo FX series quote local currency units per EUR. Local prices are divided
# by rate. London listings use pence and therefore price_multiplier 0.01.
fx_rates:
